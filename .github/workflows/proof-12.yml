# TEMPORARY (issue #12): proves post-publish-smoke.yml on this branch,
# through workflow_call as release.yml uses it, before the file is on
# master (workflow_dispatch needs it there). Deleted before merge.
name: Proof for 12

on:
  push:
    branches: [feat/12-registry-smoke]
    paths: [.github/workflows/proof-12.yml]

permissions:
  contents: read

jobs:
  green-0-1-0:
    uses: ./.github/workflows/post-publish-smoke.yml
    with:
      version: 0.1.0
    permissions:
      contents: read
      issues: write

  # Deliberately red: 0.0.99 was never published. Must time out on npm
  # and open an issue.
  red-0-0-99:
    uses: ./.github/workflows/post-publish-smoke.yml
    with:
      version: 0.0.99
      wait-minutes: '1'
    permissions:
      contents: read
      issues: write
