name: Release

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # The same gates as every PR (ci.yml), on this exact commit. Nothing is
  # published unless they pass.
  gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: gates
    runs-on: ubuntu-latest
    # Only this job can write or mint an OIDC token. npm trusts the
    # workflow file release.yml (ADR-0016), so publishing must stay here.
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing (ADR-0016)
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      # tokens@0.1.0,components@0.2.0: only the packages just published.
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Published files (dist/, cdn/, custom-elements.json) are gitignored.
      - run: pnpm build
      - uses: changesets/action@v2
        id: changesets
        with:
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # publishedPackages is [{"name": "@hostkit-ui/tokens", "version": "0.1.0"}, …].
      - name: Read the published versions
        id: versions
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          versions=$(jq -r '[.[] | select(.name == "@hostkit-ui/tokens" or .name == "@hostkit-ui/components")
            | "\(.name | ltrimstr("@hostkit-ui/"))@\(.version)"] | join(",")' <<< "$PUBLISHED")
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  # Issue #12: the versions just published, installed from npm and loaded
  # from jsDelivr, pass the apps' smoke tests. A failure opens an issue.
  # It lives in its own workflow file, so it never gets id-token: write
  # and a manual run can't reach the publish step.
  post-publish:
    needs: release
    if: needs.release.outputs.published == 'true' && needs.release.outputs.versions != ''
    uses: ./.github/workflows/post-publish-smoke.yml
    with:
      version: ${{ needs.release.outputs.versions }}
    permissions:
      contents: read
      issues: write
