name: Release

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # The same gates as every PR (ci.yml), on this exact commit. Nothing is
  # published unless they pass.
  gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: gates
    runs-on: ubuntu-latest
    # Only this job can write or mint an OIDC token. npm trusts the
    # workflow file release.yml (ADR-0016), so publishing must stay here.
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing (ADR-0016)
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Published files (dist/, cdn/, custom-elements.json) are gitignored.
      - run: pnpm build
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
